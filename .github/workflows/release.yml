name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck, test and build
        run: npm run ci

  publish:
    name: Publish ${{ matrix.target }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Build with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AI Canvas v0.9.18 - 节点 AI 润色与首尾帧识别修正'
          releaseBody: |
            ## ✨ 版本摘要

            AI Canvas v0.9.18 新增节点 AI 润色：提示词面板支持一键润色并新增独立润色面板，AI 节点对话框同步支持，同时优化金属发送按钮质感；修正视频首尾帧的识别与启用条件，普通参考图不再被自动当作首帧，并修复即梦（Dreamina）参考图模式下的首尾帧识别；同时接入原生图形兼容配置，开启后自动重启以生效。

            ## 🤖 节点 AI 润色

            - 新增节点 AI 润色：提示词面板支持一键润色，新增润色面板与润色服务，AI 节点对话框同步支持。
            - 优化金属发送按钮的质感与交互反馈。

            ## 🎬 视频首尾帧

            - 普通参考图不再自动识别为首帧，避免被误当作首尾帧输入。
            - 首尾帧仅在显式设置时启用，未设置时不再附带首尾帧参数。
            - 修复即梦（Dreamina）参考图模式下的首尾帧识别，并补充工作流对首尾帧的判定。

            ## ⚡ 图形兼容

            - 接入原生图形兼容配置，开启后自动重启应用以使配置生效。

            ## ⚠️ 升级与兼容性

            - 升级后已有插件会在首次加载时补全源码摘要，无需重新安装。
            - 私有注册表目录（`plugin-private`）被用户手动删除时，已有插件会停用并要求重新安装；这是预期的失败关闭行为，不会从浏览器存储静默恢复。
            - RunningHub 与 AutoDL 工作流需要配置对应的服务地址与凭据。
            - Blender 原生运行时需要本机已安装 Blender，且需授权项目目录。
            - Windows 旧款 CPU（不支持 AVX/AVX2）请使用名称含 `Legacy` 的安装包；该版本不包含本地 ONNX 功能。
            - 本地语音转文本依赖桌面端 ONNX 运行时；Intel Mac 和 Windows Legacy 安装包不包含该功能。
            - 视频剪辑器依赖本地编解码能力，实际可用导出编码格式取决于本机编解码器。
            - 浏览器模式无法使用桌面端凭据存储，API Key 仅在当前会话有效，重启后需要重新填写。
            - 视频剪辑窗口、应用内 ComfyUI、MCP 控制桥、长按圆环和本地文件导出仅在桌面版可用。

            ## 📦 下载

            - 🪟 Windows：使用 `.exe` 或 `.msi`。
            - 🪟 Windows 旧款 CPU：使用名称含 `Legacy` 的 `.exe` 或 `.msi`；该版本不包含本地 ONNX 功能。
            - 🍎 macOS：Apple Silicon 使用 `aarch64.dmg`，Intel 使用 `x64.dmg`。
            - 🐧 Linux：使用 `.AppImage`、`.deb` 或 `.rpm`。
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --target ${{ matrix.target }}

  publish-windows-legacy:
    name: Publish Windows x64 legacy
    needs: publish
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install npm dependencies
        run: npm ci

      - name: Build Windows x64 legacy
        shell: pwsh
        env:
          RUSTFLAGS: -C target-cpu=x86-64 -C target-feature=-avx,-avx2,-fma
        run: |
          $legacyConfig = '{"productName":"AI Canvas Legacy","plugins":{"updater":{"endpoints":[]}},"bundle":{"createUpdaterArtifacts":false}}'
          node node_modules/@tauri-apps/cli/tauri.js build `
            --target x86_64-pc-windows-msvc `
            --config $legacyConfig `
            -- `
            --no-default-features

      - name: Upload Windows x64 legacy installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $bundleRoot = Resolve-Path "src-tauri/target/x86_64-pc-windows-msvc/release/bundle"
          $artifacts = @(
            Get-ChildItem -LiteralPath $bundleRoot -Recurse -File |
              Where-Object { $_.Extension -in '.exe', '.msi' }
          )
          if ($artifacts.Count -eq 0) {
            throw "No Windows x64 legacy installers were generated."
          }
          foreach ($artifact in $artifacts) {
            gh release upload "${{ github.ref_name }}" $artifact.FullName --clobber
          }
